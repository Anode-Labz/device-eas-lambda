---
Description: AWS Lambda Typescript Stack

Parameters:
  SomeParameter:
    Type: String
  LambdaFunctionName:
    Type: String
    MinLength: 1
  TextureApiKey:
    Type: String
    NoEcho: true
    MinLength: 1
  EthereumProvider:
    Type: String
    NoEcho: true
    MinLength: 1
  DaylightSigningKey:
    Type: String
    NoEcho: true
    MinLength: 64
  DaylightDeviceContractAddress:
    Type: String
    AllowedPattern: '^0x[0-9a-fA-F]{40}$'

Outputs:
  LambdaUrl:
    Description: The HTTPS endpoint of the Lambda function.
    Value: !GetAtt LambdaUrl.FunctionUrl

Resources:
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: 7

  Lambda:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Description: Device minting Lambda function.
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      Handler: lambda.handler
      Code:
        ZipFile: 'placeholder - do not change'
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: '--enable-source-maps'
          SOME_PARAMETER: !Ref SomeParameter
          TEXTURE_API_KEY: !Ref TextureApiKey
          ETHEREUM_PROVIDER: !Ref EthereumProvider
          DAYLIGHT_SIGNING_KEY: !Ref DaylightSigningKey
          DAYLIGHT_DEVICE_CONTRACT_ADDRESS: !Ref DaylightDeviceContractAddress

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Lambda
      FunctionUrlAuthType: AWS_IAM
      Action: lambda:InvokeFunctionUrl
      Principal: '*'

  LambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: AWS_IAM
      TargetFunctionArn: !Ref Lambda

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: '/'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
